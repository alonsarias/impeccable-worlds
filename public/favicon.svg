<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Impeccable Worlds">
  <!-- White tile so the mark holds on light and dark browser chrome. -->
  <rect width="32" height="32" rx="7" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Concentric world: catalog of directions, readable at 16px. -->
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="16" cy="16" r="1.5" fill="#000000"/>
</svg>
