<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Impeccable Worlds — share card</title>
    <!--
      1200×630 home share card. Brand lockup, not a world hero.
      White caption margin, black wave wall. Host Grotesk.
      Rasterize with: npm run og
    -->
    <style>
      @font-face {
        font-family: "Host Grotesk";
        font-style: normal;
        font-weight: 400;
        src: url("../public/fonts/host-grotesk-400-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Host Grotesk";
        font-style: normal;
        font-weight: 700;
        src: url("../public/fonts/host-grotesk-700-latin.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
      }
      .card {
        display: grid;
        grid-template-columns: 614px 1fr;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
        color: #000;
        font-family: "Host Grotesk", Helvetica, Arial, sans-serif;
      }
      .caption {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 32px;
        padding: 0 40px 0 64px;
        background: #fff;
      }
      h1 {
        margin: 0;
        font-size: 100px;
        font-weight: 700;
        line-height: 0.86;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        font-size: 32px;
        font-weight: 400;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }
      .wall {
        background: #fff;
      }
      .wall svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="caption">
        <h1>Impeccable<br />Worlds</h1>
        <p>Choose a direction by eye.<br />Copy the prompt.</p>
      </div>
      <div class="wall" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="wave" width="108" height="162" patternUnits="userSpaceOnUse">
              <path
                fill="none"
                stroke="#000"
                stroke-width="2.75"
                d="M 12.60 0 Q 22.68 40.50 12.60 81.00 Q 2.52 121.50 12.60 162.00 M 48.60 0 Q 58.68 40.50 48.60 81.00 Q 38.52 121.50 48.60 162.00 M 84.60 0 Q 94.68 40.50 84.60 81.00 Q 74.52 121.50 84.60 162.00"
              />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#wave)" />
        </svg>
      </div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        document.documentElement.dataset.ready = "1";
      });
    </script>
  </body>
</html>
