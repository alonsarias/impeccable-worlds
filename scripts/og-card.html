<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <style>
      @font-face {
        font-family: "Host Grotesk";
        font-style: normal;
        font-weight: 400;
        src: url("/fonts/host-grotesk-400-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Host Grotesk";
        font-style: normal;
        font-weight: 700;
        src: url("/fonts/host-grotesk-700-latin.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        background: #fff;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 48px;
        padding: 0 120px;
        border: 3px solid #000;
        background: #fff;
        color: #000;
        font-family: "Host Grotesk", Helvetica, Arial, sans-serif;
      }
      img {
        width: 280px;
        height: 280px;
        display: block;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 56px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        font-size: 24px;
        line-height: 1.35;
        font-weight: 400;
        max-width: 28ch;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="" />
      <div>
        <h1>Impeccable Worlds</h1>
        <p>An unofficial catalog of design worlds and directions.</p>
      </div>
    </div>
  </body>
</html>
